  }
  html += "</div>";
  return html;
}

/* =========================================================
   CHIPPING PRACTICE TRACKER (independent section)
   Same logic as putting, plus a user-planted pin.
========================================================= */
const CHIP_W = 500, CHIP_H = 420;
const CHIP_SCALE = 3.8;                    // fixed px per yd — 50-yd ring (190px) always fully visible
const CHIP_CENTER = { x: 250, y: 210 };    // the pin is panned to this screen point
const CHIP_MADE_R = 8;            // taps this close to the pin count as holed

function chipOffsets(r) {
  if (!r.pin) return { dx: 0, dy: 0 };
  return { dx: CHIP_CENTER.x - r.pin.x, dy: CHIP_CENTER.y - r.pin.y };
}

function freshChipRound() {
  return { id: Date.now(), date: todayStr(), pin: null, start: null, distanceYds: null, shots: [], done: false };
}
function saveChip() {
  save(KEYS.chipCurrent, chipCurrent);
  save(KEYS.chipRounds, chipRounds);
}
function chipStats(r) {
  if (!r.pin) return { makes: 0, avgMissYds: null };
  const makes = r.shots.filter(p => pdist(p, r.pin) <= CHIP_MADE_R).length;
  let avgMissYds = null;
  if (r.shots.length) {
    // same fixed px-per-yd scale as the rings
    avgMissYds = r.shots.reduce((a, p) => {
      const d = pdist(p, r.pin);
      return a + (d <= CHIP_MADE_R ? 0 : d / CHIP_SCALE);
    }, 0) / r.shots.length;
  }
  return { makes: makes, avgMissYds: avgMissYds };
}

function chipGreenSVG(r, interactive) {
  const off = chipOffsets(r);
  let svg = '<svg id="chip-green" viewBox="0 0 ' + CHIP_W + " " + CHIP_H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chipping green"'
    + (interactive ? ' class="tappable" onclick="chipCanvasClick(event)"' : "")
    + ">"
    + "<defs>"
    + '<pattern id="roughp" width="22" height="22" patternUnits="userSpaceOnUse">'
    + '<rect width="22" height="22" fill="#2F6C34"/>'
    + '<circle cx="6" cy="6" r="3.2" fill="#2A612F"/>'
    + '<circle cx="17" cy="14" r="2.6" fill="#356F39"/>'
    + "</pattern>"
    + "</defs>"
    /* the whole scene pans so the planted pin lands at screen center */
    + '<g transform="translate(' + off.dx.toFixed(1) + " " + off.dy.toFixed(1) + ')">'
    /* oversized rough so panning never reveals gaps */
    + '<rect x="-300" y="-300" width="1100" height="1020" fill="url(#roughp)"/>'
    /* surrounding foliage */
    + '<circle cx="472" cy="52" r="46" fill="#A9B23A" opacity="0.85"/>'
    + '<circle cx="500" cy="118" r="32" fill="#8FA22F" opacity="0.8"/>'
    + '<circle cx="14" cy="36" r="30" fill="#245427" opacity="0.9"/>'
    + '<circle cx="18" cy="396" r="40" fill="#1F4A24" opacity="0.9"/>'
    + '<circle cx="482" cy="400" r="36" fill="#245427" opacity="0.9"/>'
    /* fringe + green */
    + '<ellipse cx="250" cy="210" rx="205" ry="162" fill="#4C8740"/>'
    + '<ellipse cx="250" cy="210" rx="182" ry="142" fill="#9AAB56"/>'
    + '<ellipse cx="250" cy="208" rx="152" ry="115" fill="#A3B25E" opacity="0.55"/>';

  // aim line (world coords)
  if (r.pin && r.start) {
    svg += '<line x1="' + r.start.x.toFixed(1) + '" y1="' + r.start.y.toFixed(1) + '" x2="' + r.pin.x.toFixed(1) + '" y2="' + r.pin.y.toFixed(1) + '" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 7" opacity="0.7"/>';
  }

  // shots (world coords) — holed balls nest around the pin
  if (r.pin) {
    const OFFS = [
      {x:0,y:0},{x:6,y:-3},{x:-6,y:-3},{x:4,y:6},{x:-4,y:6},
      {x:8,y:2},{x:-8,y:2},{x:0,y:-7},{x:7,y:7},{x:-7,y:7}
    ];
    let holed = 0;
    r.shots.forEach((p, i) => {
      const made = pdist(p, r.pin) <= CHIP_MADE_R;
      let bx = p.x, by = p.y, br = 6;
      if (made) {
        const o = OFFS[holed % OFFS.length];
        holed++;
        bx = r.pin.x + o.x; by = r.pin.y + o.y; br = 4.5;
      }
      svg += '<circle cx="' + bx.toFixed(1) + '" cy="' + by.toFixed(1) + '" r="' + br + '" fill="' + (made ? "#FFD23F" : "#FFFFFF") + '" stroke="#14281D" stroke-width="1.3"/>'
        + '<text x="' + bx.toFixed(1) + '" y="' + (by + 2.4).toFixed(1) + '" text-anchor="middle" font-size="' + (made ? 6.5 : 7.5) + '" font-weight="bold" font-family="sans-serif" fill="#14281D">' + (i + 1) + "</text>";
    });
  }

  // start marker (world coords)
  if (r.start) {
    svg += '<circle cx="' + r.start.x.toFixed(1) + '" cy="' + r.start.y.toFixed(1) + '" r="10" fill="none" stroke="#FFFFFF" stroke-width="2"/>'
      + '<circle cx="' + r.start.x.toFixed(1) + '" cy="' + r.start.y.toFixed(1) + '" r="5.5" fill="#FFFFFF" stroke="#14281D" stroke-width="1.3"/>'
      + '<text x="' + r.start.x.toFixed(1) + '" y="' + (r.start.y - 15).toFixed(1) + '" text-anchor="middle" font-size="10" font-weight="bold" font-family="sans-serif" fill="#FFFFFF">START</text>';
  }
  svg += "</g>";

  // rings + pin at fixed screen center (the pan puts the pin exactly here,
  // so all five dashed rings and their labels are always fully visible)
  if (r.pin) {
    const cx = CHIP_CENTER.x, cy = CHIP_CENTER.y;
    [10, 20, 30, 40, 50].forEach(yd => {
      const rad = yd * CHIP_SCALE;
      svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + rad.toFixed(1) + '" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-dasharray="5 8" opacity="0.55"/>'
        + ringLabel(cx, cy, rad, yd, CHIP_W, CHIP_H);
    });
    svg += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx - 40) + '" y2="' + (cy + 55) + '" stroke="#14301B" stroke-width="3" opacity="0.22" stroke-linecap="round"/>'
      + '<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#14301B"/>'
      + '<line x1="' + cx + '" y1="' + cy + '" x2="' + cx + '" y2="' + (cy - 42) + '" stroke="#EDE8DA" stroke-width="2.5"/>'
      + '<polygon points="' + cx + "," + (cy - 42) + " " + (cx + 28) + "," + (cy - 34) + " " + cx + "," + (cy - 26) + '" fill="#D6362B"/>';
  }
  svg += "</svg>";
  return svg;
}

function chipCanvasClick(evt) {
  if (viewChipId != null) return;
  if (!chipCurrent) chipCurrent = freshChipRound();
  const r = chipCurrent;
  if (r.done) return;
  const svg = evt.currentTarget;
  const b = svg.getBoundingClientRect();
  const off = chipOffsets(r); // pan applied before this tap
  const x = (evt.clientX - b.left) / b.width * CHIP_W - off.dx;
  const y = (evt.clientY - b.top) / b.height * CHIP_H - off.dy;
  if (!r.pin) {
    r.pin = { x: x, y: y };
  } else if (!r.start) {
    r.start = { x: x, y: y };
  } else if (r.shots.length < 10) {
    r.shots.push({ x: x, y: y });
    if (r.shots.length === 10) {
      r.done = true;
      chipRounds.push(JSON.parse(JSON.stringify(r)));
      toast("Chipping round of 10 saved! 🥅");
    }
  }
  saveChip();
  render();
}
function setChipDistance(v) {
  if (!chipCurrent) chipCurrent = freshChipRound();
  chipCurrent.distanceYds = v === "" ? null : Number(v);
  if (chipCurrent.done) {
    const saved = chipRounds.find(x => x.id === chipCurrent.id);
    if (saved) saved.distanceYds = chipCurrent.distanceYds;
  }
  saveChip();
}
function undoChip() {
  if (viewChipId != null || !chipCurrent) return;
  const r = chipCurrent;
  if (r.done) { toast("Round already saved — start a new round instead."); return; }
  if (r.shots.length) r.shots.pop();
  else if (r.start) r.start = null;
  else r.pin = null;
  saveChip(); render();
}
function resetChipRound() {
  if (!confirmTap("resetChip", "Tap again to clear the current round ⚠️")) return;
  chipCurrent = freshChipRound();
  viewChipId = null;
  saveChip(); render();
}
function newChipRound() {
  chipCurrent = freshChipRound();
  viewChipId = null;
  saveChip(); render();
  toast("Fresh green — tap to plant the pin. 🚩");
}
function viewChipRound(id) { viewChipId = id; render(); window.scrollTo({ top: 0 }); }
function backToCurrentChip() { viewChipId = null; render(); }
function deleteChipRound(id) {
  if (!confirmTap("delChip" + id, "Tap ✕ again to delete this round ⚠️")) return;
  chipRounds = chipRounds.filter(r => r.id !== id);
  if (viewChipId === id) viewChipId = null;
  saveChip(); render();
  toast("Round deleted.");
}

function renderChipping() {
  if (!chipCurrent) chipCurrent = freshChipRound();
  const viewing = viewChipId != null ? chipRounds.find(x => x.id === viewChipId) : null;
  const r = viewing || chipCurrent;
  const st = chipStats(r);

  let status;
  if (viewing) status = "👀 Viewing saved round from " + esc(r.date);
  else if (!r.pin) status = "Step 1 — tap the green to plant the PIN 🚩";
  else if (!r.start) status = "Step 2 — tap your chipping START spot";
  else if (!r.done) status = "Ball " + (r.shots.length + 1) + " of 10 — tap where it finished";
  else status = "Round complete &amp; saved ✅ — save the image or start a fresh green";

  let html = '<div class="card"><h2>🪁 Chipping Practice</h2>'
    + '<p class="muted" style="margin-top:0;">Tap once to plant the pin, once more for your start spot, then tap where each of 10 chips finishes. Balls holed turn gold. Rounds auto-save after ball 10 and feed the AI Coach.</p>'
    + '<div class="form-grid" style="margin-bottom:6px;">'
    + '<div class="field"><label for="chip-dist">Start distance to pin (yds)</label>'
    + '<input type="number" id="chip-dist" step="0.5" min="0" inputmode="decimal" value="' + esc(r.distanceYds ?? "") + '" onchange="setChipDistance(this.value)"' + (viewing ? " disabled" : "") + "></div>"
    + '<div class="field"><label>Round stats</label><div class="putt-chips" style="margin:0;">'
    + '<span class="chip">🏌️ ' + r.shots.length + "/10</span>"
    + '<span class="chip">🥅 ' + st.makes + " holed</span>"
    + (st.avgMissYds != null ? '<span class="chip">📏 avg miss ' + st.avgMissYds.toFixed(1) + " yds</span>" : "")
    + "</div></div>"
    + "</div>"
    + '<p class="putt-status">' + status + "</p>"
    + '<div class="putt-frame">' + chipGreenSVG(r, !viewing && !r.done) + "</div>"
    + '<div class="btn-row" style="margin-top:12px;">';
  if (viewing) {
    html += '<button class="btn" onclick="backToCurrentChip()">⬅️ Back to Current Round</button>'
      + '<button class="btn secondary" onclick="exportSVGPNG(\'chip-green\',\'chipping-green\')">📸 Save Green Image (PNG)</button>';
  } else {
    html += '<button class="btn secondary" onclick="undoChip()">↩️ Undo Last Tap</button>'
      + '<button class="btn secondary" onclick="resetChipRound()">🔄 Reset Round</button>'
      + '<button class="btn secondary" onclick="exportSVGPNG(\'chip-green\',\'chipping-green\')">📸 Save Green Image (PNG)</button>';
    if (r.done) html += '<button class="btn" onclick="newChipRound()">🟢 Start New Round</button>';
  }
  html += "</div></div>";

  /* saved rounds */
  html += '<div class="card"><h3>📚 Saved Rounds</h3>';
  if (chipRounds.length) {
    html += '<div class="table-wrap"><table><thead><tr><th>Date</th><th>Dist (yds)</th><th>Balls</th><th>Holed</th><th>Avg miss (yds)</th><th></th><th></th></tr></thead><tbody>';
    chipRounds.slice().sort((a,b) => b.id - a.id).forEach(cr => {
      const cs = chipStats(cr);
      html += "<tr><td>" + esc(cr.date) + "</td>"
        + '<td class="num">' + fmt(cr.distanceYds, 1) + "</td>"
        + '<td class="num">' + cr.shots.length + "</td>"
        + '<td class="num">' + cs.makes + "</td>"
        + '<td class="num">' + (cs.avgMissYds != null ? cs.avgMissYds.toFixed(1) : "–") + "</td>"
        + '<td><button class="btn small secondary" onclick="viewChipRound(' + cr.id + ')">View</button></td>'
        + '<td><button class="btn small secondary" onclick="deleteChipRound(' + cr.id + ')">✕</button></td>'
        + "</tr>";
    });
    html += "</tbody></table></div>"
      + '<p class="muted" style="margin:8px 0 0;">All saved rounds ride along in the AI Coach payload and the JSON export.</p>';
  } else {
    html += '<div class="chart-empty">No saved rounds yet — finish a round of 10 and it lands here.</div>';
  }
  html += "</div>";
  return html;
}

/* =========================================================
   AI COACH
========================================================= */
function buildAIPayload() {
  return {
    userProfile: userProfile,
    weeklySchedule: weeklyPlan.map(d => ({ day: d.day, type: d.type, title: d.title })),
    currentExercises: weeklyPlan.map(d => ({
      day: d.day,
      exercises: d.exercises.map(ex => ({
        name: ex.name,
        feelAfter: ex.feelAfter,
        note: ex.note || "",
        sets: ex.sets.map(s => {
          const o = { reps: s.reps, done: !!s.done };
          if ("weight" in s) { o.weight = s.weight; o.rpe = s.rpe; }
          return o;
        })
      })),
      clubNotes: d.notes
    })),
    workoutHistory: history,
    dailyFeel: dailyFeel,
    exerciseFeelLog: exerciseFeelLog,
    simulatorSessions: simulatorSessions,
    puttingPractice: puttingRounds.map(r => {
      const ps = puttStats(r);
      return {
        date: r.date,
        startDistanceYds: r.distanceYds,
        balls: r.putts.length,
        makes: ps.makes,
        avgMissYds: ps.avgMissYds != null ? Number(ps.avgMissYds.toFixed(1)) : null,
        holeXY: PUTT_HOLE,
        startXY: r.start,
        finishXY: r.putts
      };
    }),
    chippingPractice: chipRounds.map(r => {
      const cs = chipStats(r);
      return {
        date: r.date,
        startDistanceYds: r.distanceYds,
        balls: r.shots.length,
        holed: cs.makes,
        avgMissYds: cs.avgMissYds != null ? Number(cs.avgMissYds.toFixed(1)) : null,
        pinXY: r.pin,
        startXY: r.start,
        finishXY: r.shots
      };
    })
  };
}

function buildAIPrompt() {
  const payload = buildAIPayload();
  return "You are an experienced golf fitness and performance coach. Below is my complete training data as JSON: "
    + "my profile, my fixed weekly schedule, the current exercises per day, my workout completion history, "
    + "my per-exercise feel log (1=felt awful, 5=felt great, across many sessions), how I felt each day overall, "
    + "and every simulator shot I logged (carry, total distance, launch angle, launch direction L/R, back spin, "
    + "side spin L/R, shot shape, ball speed, club speed, smash factor, notes), plus my putting practice rounds "
    + "(start distance to hole in yards, makes out of 10, average miss in yards, and the tap coordinates of every finish point "
    + "relative to holeXY — use the scatter to spot distance-control or left/right bias issues), and my chipping practice "
    + "rounds in the same format (pinXY is the planted pin, startXY the chipping spot, finishXY the scatter of results).\n\n"
    + "TASK: Redesign next week's EXERCISES based on this data. Pay special attention to: (1) exercises with "
    + "consistently low feel ratings — replace or modify them; (2) swing data trends — distance, spin, direction "
    + "bias, shot shape distribution and smash factor — and pick exercises that address the weaknesses they reveal. "
    + "Keep everything golf-specific, safe, and progressive.\n\n"
    + "HARD RULES:\n"
    + "1. Keep the weekly SCHEDULE exactly as-is: same 7 days, same type (gym/simulator/recovery) and same title per day. Only change the exercises inside each day.\n"
    + "2. Sunday stays a full rest day with an empty exercises array.\n"
    + "3. For gym exercises where I should log weight and RPE, set \"trackWeight\": true on each of those sets.\n"
    + "4. Respond with ONLY valid JSON. No markdown, no code fences, no commentary before or after.\n\n"
    + "RESPONSE FORMAT (exactly this shape):\n"
    + '{"days":[{"day":"Monday","exercises":[{"name":"Exercise name","sets":[{"reps":"description","trackWeight":false}]}]}, ...all 7 days...]}\n\n'
    + "MY DATA:\n" + JSON.stringify(payload);
}

function setAIStatus(msg, cls) {
  const el = document.getElementById("ai-status");
  if (el) { el.textContent = msg; el.className = "ai-status " + (cls || ""); }
}

async function askClaude() {
  setAIStatus("Caddying your data over to Claude… ⛳", "");
  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: buildAIPrompt() }]
      })
    });
    if (!response.ok) throw new Error("API returned " + response.status);
    const data = await response.json();
    const text = (data.content || [])
      .filter(item => item.type === "text")
      .map(item => item.text)
      .join("\n");
    applyNewPlanFromText(text);
  } catch (err) {
    console.error("Claude API error:", err);
    setAIStatus("Couldn't reach Claude from here (" + err.message + "). If you opened this file locally, use the copy & paste option below instead.", "err");
  }
}

function applyNewPlanFromText(text) {
  let parsed;
  try {
    const clean = String(text).replace(/```json|```/g, "").trim();
    parsed = JSON.parse(clean);
  } catch (e) {
    setAIStatus("Claude's reply wasn't valid JSON. Try again, or use copy & paste and check the reply.", "err");
    return;
  }
  applyNewPlan(parsed);
}

function applyNewPlan(parsed) {
  if (!parsed || !Array.isArray(parsed.days)) {
    setAIStatus("Reply was missing a \"days\" array — plan unchanged.", "err");
    return;
  }
  save(KEYS.planBackup, weeklyPlan);
  let changed = 0;
  weeklyPlan.forEach(d => {
    const nd = parsed.days.find(x => x && x.day === d.day);
    if (!nd || !Array.isArray(nd.exercises)) return;
    d.exercises = nd.exercises.map(ex => ({
      name: String(ex.name || "Exercise"),
      feelAfter: null,
      note: "",
      sets: (Array.isArray(ex.sets) ? ex.sets : []).map(s => {
        const o = { reps: String((s && s.reps) || ""), done: false };
        if (s && s.trackWeight) { o.weight = null; o.rpe = null; }
        return o;
      })
    }));
    changed++;
  });
  saveAll();
  setAIStatus("Plan renovated! " + changed + " day(s) updated. Old plan backed up — use Undo if needed.", "ok");
  toast("New week, new plan! 🪄 Check the Plan tab.");
  render();
}

function applyPastedPlan() {
  const el = document.getElementById("ai-paste");
  if (!el || !el.value.trim()) { setAIStatus("Paste Claude's JSON reply into the box first.", "err"); return; }
  applyNewPlanFromText(el.value);
}

function undoAIPlan() {
  const backup = load(KEYS.planBackup, null);
  if (!backup) { setAIStatus("No backup found — nothing to undo yet.", "err"); return; }
  weeklyPlan = backup;
  saveAll();
  setAIStatus("Previous plan restored. ↩️", "ok");
  toast("Plan restored to the pre-renovation version.");
  render();
}

async function copyAIPrompt() {
  const prompt = buildAIPrompt();
  try {
    await navigator.clipboard.writeText(prompt);
    setAIStatus("Prompt copied! Paste it into a Claude chat, then paste the JSON reply back below.", "ok");
  } catch (e) {
    const el = document.getElementById("ai-paste");
    if (el) { el.value = prompt; el.select(); }
    setAIStatus("Clipboard blocked — the prompt is in the box below. Copy it manually (Ctrl/Cmd+C), then clear the box and paste Claude's reply.", "err");
  }
}

/* =========================================================
   EXPORT
========================================================= */
function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type: type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function exportData() {
  const data = {
    exportedAt: new Date().toISOString(),
    userProfile: userProfile,
    weeklyPlan: weeklyPlan,
    simulatorSessions: simulatorSessions,
    dailyFeel: dailyFeel,
    history: history,
    exerciseFeelLog: exerciseFeelLog,
    puttingRounds: puttingRounds,
    puttingCurrent: puttCurrent,
    chippingRounds: chipRounds,
    chippingCurrent: chipCurrent
  };
  downloadBlob(JSON.stringify(data, null, 2), "golf-tracker-data.json", "application/json");
  toast("Exported golf-tracker-data.json 💾");
}
function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCSV() {
  if (!simulatorSessions.length) { toast("No sim shots to export yet 🎯"); return; }
  const headers = ["date","day","club","totalDistance","carry","launchAngle","launchDirDeg","launchDirSide","backSpin","sideSpin","sideSpinSide","direction","ballSpeed","clubSpeed","smashFactor","notes"];
  let csv = headers.join(",") + "\n";
  simulatorSessions.forEach(s => {
    csv += headers.map(h => csvCell(s[h])).join(",") + "\n";
  });
  downloadBlob(csv, "golf-tracker-sim-shots.csv", "text/csv");
  toast("Exported golf-tracker-sim-shots.csv — opens straight in Excel 📊");
}

/* =========================================================
   MAIN RENDER
========================================================= */
function render() {
  const app = document.getElementById("app");
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  if (view === "plan") {
    document.getElementById("tab-plan").classList.add("active");
    app.innerHTML = renderPlan();
  } else if (view === "today" || view === "workout") {
    document.getElementById("tab-today").classList.add("active");
    app.innerHTML = renderWorkout(selectedDay);
  } else if (view === "putt") {
    document.getElementById("tab-putt").classList.add("active");
    app.innerHTML = renderPutting();
  } else if (view === "chip") {
    document.getElementById("tab-chip").classList.add("active");
    app.innerHTML = renderChipping();
  } else {
    document.getElementById("tab-progress").classList.add("active");
    app.innerHTML = renderProgress();
  }
}

updateTagline();
render();
</script>
